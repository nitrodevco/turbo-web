# The public site, e.g. example.com. In Ploi: Site > Manage > Edit NGINX configuration. Keep
# Ploi's server block, its SSL lines and its "include" lines, and replace its "root" line and
# "location / { ... }" block with what is below.

# 1. Serve the built site. Point the root at dist/ inside the site directory.
root /home/ploi/example.com/dist;
index index.html;

# A single-page app: every path that is not a file is the app (/welcome, /play). This must be the
# site's only "location /": delete Ploi's own (try_files ... /index.php or =404). Check with:
# sudo nginx -t
location / {
    try_files $uri /index.html;
}

# Built files are named after their contents, so they can be cached for good.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}

# 2. The public site API, on the site's own origin. Turbo listens on loopback (TURBO_WEB_URL).
#    Discord sends people back to /api/auth/discord/callback here.
location /api/ {
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    # Turbo rate-limits sign-in by client address and trusts this header from loopback only.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 16k;
}

# 3. Behind Cloudflare: see docs/cloudflare.md in turbo-cloud, as for the admin panel.

# 4. The client runs in a frame from its own subdomain, and avatars may come from an imager.
#    Put those hosts in frame-src and img-src. The client's own host must in turn allow this site
#    to frame it (frame-ancestors https://example.com, and no X-Frame-Options DENY).
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: https://imager.example.com; frame-src https://play.example.com; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
